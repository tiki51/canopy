name: macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "28.5.0.6"

      - name: Restore dependencies and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: macos-arm64-otp-28.5.0.6-elixir-1.20.4-release-${{ hashFiles('mix.lock') }}

      - name: Build release archive
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            scripts/build-release.sh "${GITHUB_REF_NAME#v}"
          else
            scripts/build-release.sh
          fi

      - name: Smoke-test release archive
        run: scripts/smoke-release.sh dist/*.tar.gz

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: canopy-macos-arm64
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: canopy-macos-arm64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag --generate-notes --title "Canopy ${GITHUB_REF_NAME#v}"
